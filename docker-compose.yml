name: raft-based-kv

services:
  raft-1:
    build: 
      context: .
      dockerfile: ./docker/Dockerfile.node
    ports:
      - 50051:50051
    environment:
        node_name: A
        role: leader
        election_time: 5
        followers: raft-node-2,raft-node-3,raft-node-4,raft-node-5
    container_name: raft-node-1

  raft-2:
    build: 
      context: .
      dockerfile: ./docker/Dockerfile.node
    environment:
        node_name: B
        role: follower
        election_time: 5
    container_name: raft-node-2
  raft-3:
    build: 
      context: .
      dockerfile: ./docker/Dockerfile.node
    environment:
        node_name: C 
        role: follower
        election_time: 5
    container_name: raft-node-3
  raft-4:
    build: 
      context: .
      dockerfile: ./docker/Dockerfile.node
    environment:
        node_name: D
        role: follower
        election_time: 5
    container_name: raft-node-4
  raft-5:
    build: 
      context: .
      dockerfile: ./docker/Dockerfile.node
    container_name: raft-node-5
    environment:
        node_name: E
        role: follower
        election_time: 5
  
  raft-aware-proxy:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.proxy
    container_name: raft-aware-proxy
    ports: 
      - "8080:8080"
  
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.4
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "22181:2181"
  kafka:
    image: confluentinc/cp-kafka:7.4.4
    depends_on: 
      - zookeeper
    ports:
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1 

