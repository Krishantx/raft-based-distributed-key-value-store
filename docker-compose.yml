name: raft-based-kv

services:
  raft-1:
    build: 
      context: .
      dockerfile: ./docker/Dockerfile.node
    environment:
        node_name: A
        role: leader
        election_time: 5
    container_name: raft-node-1
    ports:
      - "50051:50051"

  raft-2:
    build: 
      context: .
      dockerfile: ./docker/Dockerfile.node
    environment:
        node_name: B
        role: follower
        election_time: 5
    container_name: raft-node-2
  raft-3:
    build: 
      context: .
      dockerfile: ./docker/Dockerfile.node
    environment:
        node_name: C 
        role: follower
        election_time: 5
    container_name: raft-node-3
  raft-4:
    build: 
      context: .
      dockerfile: ./docker/Dockerfile.node
    environment:
        node_name: D
        role: follower
        election_time: 5
    container_name: raft-node-4
  raft-5:
    build: 
      context: .
      dockerfile: ./docker/Dockerfile.node
    container_name: raft-node-5
    environment:
        node_name: E
        role: follower
        election_time: 5
  
  raft-aware-proxy:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.proxy
    container_name: raft-aware-proxy
    ports: 
      - "8080:8080"
