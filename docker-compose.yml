name: raft-based-kv

services:
  raft-1:
    build: 
      context: .
      dockerfile: ./docker/Dockerfile.node
    environment:
        node_name: raft-node-1
        role: Leader
        election_time: 5
    container_name: raft-node-1
    volumes:
      - ./data/raft-1:/app/logs/

  raft-2:
    build: 
      context: .
      dockerfile: ./docker/Dockerfile.node
    environment:
        node_name: raft-node-2
        role: Follower
        election_time: 5
    container_name: raft-node-2
    volumes:
      - ./data/raft-2:/app/logs/
  raft-3:
    build: 
      context: .
      dockerfile: ./docker/Dockerfile.node
    environment:
        node_name: raft-node-3
        role: Follower
        election_time: 5
    container_name: raft-node-3
    volumes:
      - ./data/raft-3:/app/logs/
  raft-4:
    build: 
      context: .
      dockerfile: ./docker/Dockerfile.node
    environment:
        node_name: raft-node-4
        role: Follower
        election_time: 5
    container_name: raft-node-4
    volumes:
      - ./data/raft-4:/app/logs/
  raft-5:
    build: 
      context: .
      dockerfile: ./docker/Dockerfile.node
    container_name: raft-node-5
    environment:
        node_name: raft-node-5
        role: Follower
        election_time: 5
    volumes:
      - ./data/raft-5:/app/logs/
  
  raft-aware-proxy:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.proxy
    container_name: raft-aware-proxy
    ports: 
      - "8080:8080"
    

